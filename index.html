<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FreeCell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="header">
      <div class="controls">
        <button id="undo-btn" type="button" disabled>Undo</button>
        <button id="hint-btn" type="button">Hint</button>
        <div class="pill" id="moves-label">Moves: 0</div>
        <div class="pill" id="time-label">Time: 00:00</div>
        <button id="new-game-btn" type="button">New Game</button>
      </div>
    </section>

    <section class="freecell-game" id="freecell-game" aria-label="FreeCell game">
      <div class="board" id="board" aria-label="FreeCell board"></div>
      <div class="win-banner" id="win-banner">
        <div class="win-card">
          <h2>You Win</h2>
          <p id="win-stats">Great play.</p>
          <button id="play-again-btn" type="button">Play Again</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
